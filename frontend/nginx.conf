limit_req_zone $binary_remote_addr zone=translation:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=detection:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=accounts:10m rate=60r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /api/ {
        limit_req zone=translation burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
        access_log off;
    }
    location ~ ^/api/(auth|admin|history|chatgpt)(/|$) {
        limit_req zone=accounts burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
        access_log off;
    }
    location /api/documents/ {
        client_max_body_size 31m;
        limit_req zone=translation burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_read_timeout 1200s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        access_log off;
    }
    location = /api/health {
        proxy_pass http://backend:8000;
        add_header Cache-Control "no-store" always;
        access_log off;
    }
    location = /api/detect {
        limit_req zone=detection burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        add_header Cache-Control "no-store" always;
        access_log off;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
